<svg width="300" height="300" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer circle background -->
  <defs>
    <linearGradient id="badgeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Main circle -->
  <circle cx="150" cy="150" r="140" fill="url(#badgeGradient)" filter="url(#shadow)"/>

  <!-- White border -->
  <circle cx="150" cy="150" r="135" fill="none" stroke="white" stroke-width="8"/>

  <!-- Inner circle pattern -->
  <circle cx="150" cy="150" r="130" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="5,5"/>

  <!-- Shield icon -->
  <g transform="translate(150, 100)">
    <!-- Shield outline -->
    <path d="M 0 -25 L -20 -10 L -20 10 Q 0 30 0 30 Q 0 30 20 10 L 20 -10 Z"
          fill="white" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- Checkmark -->
  <g transform="translate(150, 130)">
    <circle cx="0" cy="0" r="22" fill="rgba(255,255,255,0.95)"/>
    <path d="M -8 0 L -2 6 L 10 -8"
          stroke="#0d9488" stroke-width="3" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Text: VERIFIED -->
  <text x="150" y="235" font-family="Arial, sans-serif" font-size="20" font-weight="700"
        text-anchor="middle" fill="white" letter-spacing="1">
    VERIFIED
  </text>

  <!-- Text: EMPLOYER -->
  <text x="150" y="260" font-family="Arial, sans-serif" font-size="16" font-weight="600"
        text-anchor="middle" fill="rgba(255,255,255,0.95)" letter-spacing="0.5">
    EMPLOYER
  </text>

  <!-- Decorative stars -->
  <g fill="white" opacity="0.8">
    <!-- Top left star -->
    <circle cx="60" cy="50" r="3"/>
    <circle cx="70" cy="45" r="2"/>
    <!-- Top right star -->
    <circle cx="240" cy="50" r="3"/>
    <circle cx="230" cy="45" r="2"/>
    <!-- Bottom left star -->
    <circle cx="50" cy="240" r="2"/>
    <!-- Bottom right star -->
    <circle cx="250" cy="240" r="2"/>
  </g>
</svg>
